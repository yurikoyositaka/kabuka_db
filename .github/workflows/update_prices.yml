name: update-stock-prices

on:
  schedule:
    # 東証の大引け(15:30)後に実行。平日のみ。祝日・年末年始はスクリプト側で判定して終了
    - cron: "10 7 * * 1-5"   # 日本時間 16:10
    - cron: "10 9 * * 1-5"   # 日本時間 18:10(1回目で当日分が出ていなかった時の保険。上書きなので二重実行しても問題なし)
  workflow_dispatch:
    inputs:
      force:
        description: "休場日チェックを無視して実行する(テスト用)"
        type: boolean
        default: false
      start_date:
        description: "この日付から取り直す(例: 2026-11-06)。空欄ならDBの最新日付から自動"
        type: string
        default: ""

concurrency:
  group: update-stock-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python update_prices.py
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE: ${{ inputs.force }}
          START_DATE: ${{ inputs.start_date }}
